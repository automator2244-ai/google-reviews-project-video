<!doctype html>
<html lang="he" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>תעשו ניסוי</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="ez-shared.css" />
    <style>
      /* Night mode of the brand: ink ground, white type, one neon green and one yellow */
      :root {
        --bg: #0d120e;
        --panel: #1a231c;
        --line: #2c382f;
        --fg: #f4f8f5;
        --dim: #9aa79d;
        --neon: #3fd17a;
        --sun: #ffc93c;
      }
      html,
      body,
      #root {
        background: var(--bg);
        color: var(--fg);
      }
      #glow {
        position: absolute;
        width: 1400px;
        height: 1400px;
        left: -160px;
        top: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(63, 209, 122, 0.16) 0%, rgba(63, 209, 122, 0) 62%);
      }
      #top {
        position: absolute;
        right: 80px;
        top: 180px;
        z-index: 20;
      }
      #top .wordmark {
        font-size: 32px;
        color: var(--fg);
      }
      #top .wordmark b {
        color: var(--neon);
      }
      .cap {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 360px;
        font-family: var(--display);
        font-size: 120px;
        font-weight: 800;
        line-height: 1.04;
        direction: rtl;
      }
      .y {
        color: var(--sun);
      }
      .g {
        color: var(--neon);
      }
      #search {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 640px;
        height: 132px;
        border-radius: 66px;
        background: var(--fg);
        color: #141a15;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 46px;
        direction: rtl;
      }
      #search svg {
        width: 50px;
        height: 50px;
        stroke: #4e544f;
        fill: none;
        stroke-width: 2.4;
        flex: none;
      }
      .q {
        position: relative;
        font-size: 48px;
        font-weight: 700;
        white-space: nowrap;
        display: flex;
        gap: 12px;
      }
      #cities {
        position: relative;
        display: inline-block;
        min-width: 230px;
        height: 64px;
      }
      .city {
        position: absolute;
        right: 0;
        top: 0;
        color: #007329;
        opacity: 0;
      }
      .caret {
        width: 5px;
        height: 58px;
        border-radius: 3px;
        background: #007329;
      }
      .res {
        position: absolute;
        left: 80px;
        right: 80px;
        height: 150px;
        border-radius: 34px;
        background: var(--panel);
        border: 3px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        direction: rtl;
        opacity: 0;
      }
      .res-name {
        font-size: 42px;
        font-weight: 800;
      }
      .res-row {
        margin-top: 6px;
        font-size: 32px;
        color: var(--dim);
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .res-row b {
        color: var(--sun);
        letter-spacing: 3px;
        font-weight: 700;
      }
      .res-cnt {
        font-family: var(--mono);
        font-weight: 700;
        direction: ltr;
      }
      .rank {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--line);
        font-family: var(--mono);
        font-size: 34px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #r1 {
        border-color: var(--neon);
      }
      #r1 .rank {
        background: var(--neon);
        color: #0d120e;
      }
      #r1 .res-cnt {
        color: var(--neon);
      }
      #big {
        position: absolute;
        left: 0;
        right: 0;
        top: 400px;
        text-align: center;
        font-family: var(--display);
        font-size: 400px;
        font-weight: 800;
        line-height: 1;
        color: var(--neon);
        direction: ltr;
      }
      #big-txt {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 860px;
        text-align: center;
        font-family: var(--display);
        font-size: 76px;
        font-weight: 800;
        line-height: 1.12;
        direction: rtl;
      }
      #big-src {
        position: absolute;
        left: 90px;
        right: 90px;
        top: 1120px;
        text-align: center;
        color: var(--dim);
        direction: rtl;
      }
      #big-src bdi {
        color: var(--fg);
      }
      #end-mark {
        position: absolute;
        left: 0;
        right: 0;
        top: 980px;
        text-align: center;
        font-size: 70px;
        color: var(--fg);
      }
      #end-mark b {
        color: var(--neon);
      }
      #end-call {
        position: absolute;
        left: 0;
        right: 0;
        top: 1130px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="v5-1" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="glow"></div>
      <div id="top"><div class="wordmark">EZ<b>.</b>Path<b>.</b>AI</div></div>

      <!-- 0 to 7.2: the search -->
      <section id="s1" class="scene clip" dir="rtl" lang="he" data-start="0" data-duration="7.3" data-track-index="1">
        <div class="cap" id="cap1"><span class="w">תעשו</span> <span class="w y">ניסוי:</span></div>
        <div class="cap" id="cap2"><span class="w">מי</span> <span class="w">מופיע</span> <span class="w y">ראשון?</span></div>
        <div id="search">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
          <div class="q"><span id="qtxt"></span><span id="cities"><span class="city" id="c1">פתח תקווה</span><span class="city" id="c2">חולון</span><span class="city" id="c3">רעננה</span><span class="city" id="c4">חיפה</span></span></div>
          <div class="caret" id="caret"></div>
        </div>
        <div class="res" id="r1" style="top: 850px"><div><div class="res-name">מרפאת שיניים הדר</div><div class="res-row"><span>4.9</span><b>★★★★★</b><span class="res-cnt">(187)</span></div></div><div class="rank">1</div></div>
        <div class="res" id="r2" style="top: 1030px"><div><div class="res-name">מרפאת שיניים גל</div><div class="res-row"><span>4.8</span><b>★★★★★</b><span class="res-cnt">(61)</span></div></div><div class="rank">2</div></div>
        <div class="res" id="r3" style="top: 1210px"><div><div class="res-name">המרפאה שלכם?</div><div class="res-row"><span>5.0</span><b>★★★★★</b><span class="res-cnt">(9)</span></div></div><div class="rank">3</div></div>
      </section>

      <!-- 7.2 to 10.8: 84% -->
      <section id="s2" class="scene clip" dir="rtl" lang="he" data-start="7.1" data-duration="3.8" data-track-index="2">
        <div id="big"><bdi dir="ltr"><span id="n84">0</span>%</bdi></div>
        <div id="big-txt">בודקים ביקורות <span class="g">לפני שבוחרים</span> מטפל חדש.</div>
        <div id="big-src" class="src">מקור: <bdi dir="ltr">rater8, 2025</bdi>, סקר של יותר מ-1,000 מטופלים בארה״ב</div>
      </section>

      <!-- 10.8 to 15: the turn -->
      <section id="s3" class="scene clip" dir="rtl" lang="he" data-start="10.7" data-duration="4.3" data-track-index="1">
        <div class="cap" id="cap3" style="top: 400px"><span class="w">לא</span> <span class="w">אתם?</span><br /><span class="w g">בואו</span> <span class="w g">נשנה</span> <span class="w g">את</span> <span class="w g">זה.</span></div>
        <div id="end-mark" class="wordmark">EZ<b>.</b>Path<b>.</b>AI</div>
        <div id="end-call"><div class="call-pill" id="pill"><svg viewBox="0 0 24 24"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></svg><span>055-271-6456</span></div></div>
      </section>

      <audio id="music" src="assets/audio/m5-backbeat.mp3" data-start="0" data-duration="15" data-track-index="10" data-volume="1"></audio>
      <audio id="sfx-1" src="assets/audio/click-soft.mp3" data-start="3.5" data-duration="0.37" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-2" src="assets/audio/pop.mp3" data-start="7.3" data-duration="0.72" data-track-index="11" data-volume="0.2"></audio>
    </div>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        function build() {
          const tl = gsap.timeline({ paused: true });
          const words = (sel, t, st) => tl.fromTo(sel + " .w", { opacity: 0, y: 70, rotation: 3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "power4.out", stagger: st || 0.07 }, t);

          tl.fromTo("#top", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0);
          tl.fromTo("#glow", { x: 0, y: 0, scale: 1 }, { x: 120, y: -80, scale: 1.1, duration: 15, ease: "sine.inOut" }, 0);

          // the search types from frame one
          tl.fromTo("#search", { opacity: 0.001, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0);
          const Q = "רופא שיניים ב";
          const qi = { v: 0 };
          tl.fromTo(qi, { v: 0 }, { v: Q.length, duration: 0.7, ease: "none", onUpdate: () => ($("qtxt").textContent = Q.slice(0, Math.round(qi.v))) }, 0.05);
          [["#c1", 0.8], ["#c2", 1.8], ["#c3", 2.3], ["#c4", 2.8]].forEach(([s, t], i, a) => {
            tl.fromTo(s, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, t);
            if (i < a.length - 1) tl.to(s, { opacity: 0, y: -30, duration: 0.15, ease: "power2.in" }, a[i + 1][1] - 0.12);
          });
          for (let t = 0.8, on = false; t < 7; t += 0.4, on = !on) tl.set("#caret", { opacity: on ? 1 : 0 }, t);
          words("#cap1", 0.2);
          tl.to("#cap1", { opacity: 0, y: -40, duration: 0.25, ease: "power2.in" }, 3.25);

          // results: who is first?
          ["#r1", "#r2", "#r3"].forEach((s, i) => {
            tl.fromTo(s, { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 3.5 + i * 0.12);
          });
          words("#cap2", 3.55);
          tl.fromTo("#r1", { scale: 1 }, { scale: 1.05, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 4.6);
          tl.fromTo("#r1 .res-cnt", { scale: 1 }, { scale: 1.3, duration: 0.25, ease: "back.out(3)", yoyo: true, repeat: 1 }, 5.2);
          tl.to("#r3", { opacity: 0.45, duration: 0.3, ease: "none" }, 5.8);
          tl.to(["#cap2", "#search", "#r1", "#r2", "#r3"], { opacity: 0, y: -60, duration: 0.25, ease: "power2.in", stagger: 0.03 }, 6.9);

          // 84%
          tl.fromTo("#big", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 7.2);
          const o = { v: 0 };
          tl.fromTo(o, { v: 0 }, { v: 84, duration: 0.9, ease: "power3.out", onUpdate: () => ($("n84").textContent = Math.round(o.v)) }, 7.25);
          tl.fromTo("#big-txt", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.6);
          tl.fromTo("#big-src", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 8.0);
          tl.to("#big", { scale: 1.04, duration: 2.2, ease: "sine.inOut" }, 8.2);
          tl.to(["#big", "#big-txt", "#big-src"], { opacity: 0, y: -50, duration: 0.25, ease: "power2.in", stagger: 0.03 }, 10.55);

          // the turn
          words("#cap3", 10.85, 0.08);
          tl.fromTo("#end-mark", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.7);
          tl.fromTo("#pill", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 12.0);
          tl.to("#pill", { scale: 1.06, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 13.2);

          window.__timelines = window.__timelines || {};
          window.__timelines["v5-1"] = tl;
          if (typeof window.__hfForceTimelineRebind === "function") window.__hfForceTimelineRebind();
        }
        Promise.all([
          document.fonts.load('800 120px "Frank Ruhl Libre"', "אבגד"),
          document.fonts.load('800 120px "Frank Ruhl Libre"', "0123%"),
          document.fonts.load('700 48px "Assistant"', "אבגד"),
          document.fonts.load('700 30px "JetBrains Mono"', "EZ.Path0123"),
        ])
          .then(() => document.fonts.ready)
          .then(build, build);
      })();
    </script>
  </body>
</html>
