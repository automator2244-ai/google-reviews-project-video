  const root = document.getElementById("posts");
  POSTS.forEach((p, i) => {
    const el = document.createElement("article");
    el.className = "post";
    const imgs = p.video ? "" : Array.from({ length: p.slides }, (_, k) =>
      `<img src="${p.dir}/slide-${String(k + 1).padStart(2, "0")}.jpg" alt="שקף ${k + 1} מתוך ${p.slides}" loading="${i ? "lazy" : "eager"}">`).join("");
    const viewer = p.video
      ? `<div class="viewer"><video class="reel" src="${p.dir}/reel.mp4" poster="${p.dir}/poster.jpg" controls playsinline preload="metadata"></video></div>`
      : `<div class="viewer">
        <div class="track" id="t${i}">${imgs}</div>
        <div class="nav">
          <button type="button" id="prev${i}">הקודם</button>
          <span class="count" id="c${i}">1/${p.slides}</span>
          <button type="button" id="next${i}">הבא</button>
        </div>
      </div>`;
    el.innerHTML = `
      ${viewer}
      <div>
        <div class="meta"><span class="slot">${p.slot}</span><span class="chip${p.status === 'אושר' ? '' : ' draft'}">${p.status}</span><span class="chip">${p.series}</span></div>
        <h2>${p.title}</h2>
        <div class="label">${p.format} · הכיתוב</div>
        <p class="caption"></p>
        <div class="label">הערות שלי</div>
        <ul class="notes">${p.notes.map(n => `<li></li>`).join("")}</ul>
      </div>`;
    el.querySelector(".caption").textContent = p.caption;
    el.querySelectorAll(".notes li").forEach((li, k) => li.textContent = p.notes[k]);
    root.appendChild(el);
    if (p.video) return;
    const track = el.querySelector(".track"), count = el.querySelector(".count");
    const idx = () => Math.round(track.scrollLeft / track.clientWidth);
    const go = d => track.scrollTo({ left: Math.max(0, Math.min(p.slides - 1, idx() + d)) * track.clientWidth, behavior: "smooth" });
    el.querySelector(`#prev${i}`).onclick = () => go(-1);
    el.querySelector(`#next${i}`).onclick = () => go(1);
    track.addEventListener("scroll", () => { count.textContent = `${idx() + 1}/${p.slides}`; }, { passive: true });
  });
